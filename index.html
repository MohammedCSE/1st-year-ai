<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Insurance Claim Processor</title>

    <link rel="stylesheet" href="styyle.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Insurance Claim Processor</h1>

            <p class="subtitle">
                Submit an insurance claim for assessment
            </p>

            <form id="claimForm">

                <label for="customerName">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter customer name"
                    required
                >


                <label for="claimType">
                    Claim Type
                </label>

                <select id="claimType" required>

                    <option value="">
                        Select claim type
                    </option>

                    <option value="Med">
                        Medical Consultation
                    </option>

                    <option value="Pres">
                        Prescription
                    </option>

                    <option value="Dental">
                        Dental
                    </option>

                </select>


                <label for="claimAmount">
                    Claim Amount
                </label>

                <input
                    type="number"
                    id="claimAmount"
                    placeholder="Enter claim amount"
                    min="0"
                    step="0.01"
                    required
                >
                <label for="policyFile">
    Insurance Policy PDF
                </label>

                <input
    type="file"
    id="policyFile"
    accept=".pdf"
    required
                >


                <button type="submit">
                    Submit Claim
                </button>

            </form>


            <div id="result"></div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
